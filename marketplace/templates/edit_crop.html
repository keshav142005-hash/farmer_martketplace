<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Crop</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/edit_crop.css' %}">

</head>

</html>
